{% extends "base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="form-container">
    <h2>{{ titulo }}</h2>
    <p class="subtitle">Preencha os campos para cadastrar no sistema.</p>

    <form method="post" class="card p-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{% url 'cardapio_lista' %}" class="btn btn-outline">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
